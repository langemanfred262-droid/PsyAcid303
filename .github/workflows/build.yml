name: Build VST3

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify CMake project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_OUTPUT"
            echo "Found CMakeLists.txt in repository root"
          elif [ -f PsyAcid303/CMakeLists.txt ]; then
            echo "PROJECT_DIR=PsyAcid303" >> "$GITHUB_OUTPUT"
            echo "Found CMakeLists.txt in PsyAcid303/"
          else
            echo "::error::No CMakeLists.txt found in the repository root or PsyAcid303/"
            find . -name CMakeLists.txt -print
            exit 1
          fi
        id: project

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxext-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Configure
        shell: bash
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          cmake --build build --config Release --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PsyAcid303-${{ matrix.name }}-VST3
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/PsyAcid303_artefacts/Release/VST3
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifacts
        shell: bash
        run: |
          cd artifacts
          for d in */; do
            (cd "$d" && zip -r "../${d%/}.zip" .)
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
